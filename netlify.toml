[build]
  publish = "."
  command = "npm install && npm run build:search"
  functions = "netlify/functions" # Directorio de las funciones serverless

[build.environment]
  NODE_VERSION = "20"

# Configuración de redirección después del envío del formulario
[[redirects]]
  from = "/pqrs/gracias"
  to = "/pqrs/success.html"
  status = 200

# Redirección para el envío exitoso de formularios Netlify
[[redirects]]
  from = "/thanks.html"
  to = "/pqrs/success.html"
  status = 200

# Configuración de seguridad general (actualizada)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.google.com https://translate.google.com https://www.gstatic.com https://translate.googleapis.com https://translate-pa.googleapis.com https://apis.google.com https://accounts.google.com https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://www.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' data: https:;
      font-src 'self' https: data: https://fonts.gstatic.com;
      connect-src 'self' https://api.netlify.com https://translate.googleapis.com https://translate.google.com https://translate-pa.googleapis.com https://www.google-analytics.com https://stats.g.doubleclick.net https://accounts.google.com;
      form-action 'self' https://api.netlify.com;
      frame-src 'self' https://www.google.com https://accounts.google.com https://content.googleapis.com https://translate.google.com https://translate-pa.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://docs.google.com https://drive.google.com;
    """

# Configuración específica para el formulario PQRS (actualizada)
[[headers]]
  for = "/pqrs*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.google.com https://translate.google.com https://www.gstatic.com https://translate.googleapis.com https://translate-pa.googleapis.com https://apis.google.com https://accounts.google.com https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://www.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' data: https:;
      font-src 'self' https: data:;
      connect-src 'self' https://api.netlify.com https://translate.googleapis.com https://translate.google.com https://translate-pa.googleapis.com https://www.google-analytics.com https://stats.g.doubleclick.net https://accounts.google.com;
      form-action 'self' https://api.netlify.com;
      frame-src 'self' https://www.google.com https://accounts.google.com https://content.googleapis.com https://translate.google.com https://translate-pa.googleapis.com https://docs.google.com https://drive.google.com;
    """
