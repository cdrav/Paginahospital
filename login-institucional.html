<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - Hospital Departamental San Antonio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/portal-institucional.css" />
</head>
<body class="login-page-bg">

    <div id="header-placeholder"></div>

    <main class="d-flex align-items-center justify-content-center login-main-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="card login-card shadow-lg border-0">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <h1 class="h3 fw-bold mb-0 text-brand">Acceso Institucional</h1>
                                <p class="text-muted">Uso exclusivo para personal autorizado.</p>
                            </div>
                            <form id="login-form" novalidate>
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="username" placeholder="Usuario" required autocomplete="username">
                                    <label for="username">Usuario</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required autocomplete="current-password">
                                    <label for="password">Contraseña</label>
                                </div>
                                <div class="text-end mb-3">
                                    <a href="#" class="text-decoration-none small" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div id="login-error" class="alert alert-danger d-none" role="alert">
                                    Usuario o contraseña incorrectos.
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-primary btn-lg fw-bold" type="submit">Ingresar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Recuperación de Contraseña -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Recuperar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
                    <form id="reset-password-form">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="reset-email" placeholder="nombre@ejemplo.com" required>
                            <label for="reset-email">Correo Electrónico</label>
                        </div>
                        <div id="reset-message" class="alert d-none" role="alert"></div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-bold">Enviar Enlace</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script type="module" src="js/login-institucional.js"></script>
</body>
</html>
