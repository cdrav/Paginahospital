<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#164443">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hospital Departamental San Antonio</title>
    <meta name="description" content="Noticias y eventos del Hospital Departamental San Antonio. Manténgase informado sobre nuestras actividades.">
    <link rel="icon" type="image/x-icon" href="/imagenes/icons/favicon.ico">
    <!-- El manifest se carga desde partials/header.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital@1&family=Poppins:wght@300;700;900&display=swap" rel="stylesheet">
    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/accesibilidad.css" />
    <link rel="stylesheet" href="css/accessibility-buttons.css" />
    <link rel="stylesheet" href="css/formularios.css" />
  </head>
<body data-page-title="Noticias">

<!-- Header incluido -->
<div id="header-placeholder"></div>

<!-- Contenedor para el breadcrumb -->
<div id="breadcrumb-container" class="container mt-3">
  <!-- El breadcrumb se insertará aquí mediante JavaScript -->
</div>

  <!-- Nuevo Encabezado con Filtros -->
  <header class="pt-4 pb-2 bg-light">
    <div class="container py-3">
      <div class="row justify-content-center text-center">
        <div class="col-lg-8">
          <h1 class="display-4 fw-bold mb-3 text-primary" data-page-title="Noticias y Eventos">Noticias y Eventos</h1>
          <p class="lead text-muted mb-4">Explora las últimas novedades, campañas de salud, convocatorias y actividades del Hospital Departamental San Antonio.</p>
          <div class="filter-btn-group d-flex flex-wrap gap-2 justify-content-center shadow-sm" role="group" aria-label="Filtros de noticias">
            <button type="button" class="btn btn-primary" data-filter="all" aria-pressed="true">Todo</button>
            <button type="button" class="btn btn-outline-primary" data-filter="convocatoria" aria-pressed="false">Convocatorias</button>
            <button type="button" class="btn btn-outline-primary" data-filter="evento" aria-pressed="false">Eventos</button>
            <button type="button" class="btn btn-outline-primary" data-filter="video" aria-pressed="false">Videos</button>
            <button type="button" class="btn btn-outline-primary" data-filter="comunicado" aria-pressed="false">Comunicados</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container mt-4 mb-5">
    <!-- Noticia destacada (se carga desde data/noticias.json) -->
    <section class="mb-5" id="noticia-destacada" aria-label="Noticia destacada"></section>

    <!-- Listado de noticias (se carga desde data/noticias.json) -->
    <section class="mb-5" aria-label="Listado de noticias">
      <div class="row g-4" id="noticias-lista" aria-live="polite">
        <div class="col-12 text-center text-muted py-5">
          <div class="spinner-border text-primary mb-3" role="status"></div>
          <p class="mb-0">Cargando noticias…</p>
        </div>
      </div>
    </section>

    <!-- Paginación -->
    <nav aria-label="Paginación de noticias" class="mt-5 d-flex justify-content-center" id="noticias-paginacion"></nav>
  </main>

<!-- Footer parcial -->
<div id="footer-placeholder"></div>


<!-- Scripts optimizados con defer -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/accesibilidad.js" defer></script>
<script src="js/accessibility-styles.js" defer></script>
<script src="js/busqueda.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/breadcrumb.js" defer></script>

<!-- Script específico para la página de noticias -->
<script src="js/noticias.js" defer></script>

</body>
</html>
