<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#164443">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Directorio Institucional - Hospital Departamental San Antonio</title>
    <meta name="description" content="Directorio de contacto de las dependencias y personal del Hospital Departamental San Antonio.">
    <link rel="icon" type="image/x-icon" href="/imagenes/icons/favicon.ico">
    <!-- El manifest se carga desde partials/header.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital@1&family=Poppins:wght@300;700;900&display=swap" rel="stylesheet">
    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/accesibilidad.css" />
    <link rel="stylesheet" href="css/accessibility-buttons.css" />
  </head>
  <body data-page-title="Directorio Institucional">

    <!-- Header incluido -->
    <div id="header-placeholder"></div>

    <!-- Contenedor para el breadcrumb -->
    <div id="breadcrumb-container" class="container mt-3">
      <!-- El breadcrumb se insertará aquí mediante JavaScript -->
    </div>

    <!-- Hero -->
    <section class="py-5 text-white" style="background: linear-gradient(135deg, #164443, #069681);">
      <div class="container text-center">
        <h1 class="fw-bold mb-3" data-page-title>Directorio Institucional</h1>
        <p class="lead mb-0">Encuentra la información de contacto de nuestras dependencias y personal.</p>
      </div>
    </section>

    <!-- Contenido principal -->
    <main class="container my-5 d-flex align-items-center" style="min-height: 50vh;">
      <div class="row w-100">
        <div class="col-md-8 mx-auto text-center">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-5">
              <i class="bi bi-tools display-3 text-brand mb-4"></i>
              <h2 class="h4 fw-bold mb-3">Contenido en Actualización</h2>
              <p class="text-muted mb-0">Estamos trabajando para mejorar esta sección. Muy pronto encontrarás aquí el directorio institucional completo. ¡Gracias por tu paciencia!</p>
            </div>
          </div>
        </div>
      </div>
    </main>

<!-- Footer parcial -->
<div id="footer-placeholder"></div>

<!-- Scripts optimizados con defer -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/accesibilidad.js" defer></script>

<script src="js/main.js" defer></script>
<script src="js/breadcrumb.js" defer></script>
<!-- Script específico para el directorio (deshabilitado temporalmente) -->
<!-- <script src="js/directorio.js" defer></script> -->
