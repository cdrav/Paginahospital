<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#164443">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Directorio funcionarios - Hospital Departamental San Antonio</title>
    <meta name="description" content="Directorio de contacto de las dependencias y personal del Hospital Departamental San Antonio.">
    <link rel="icon" type="image/x-icon" href="/imagenes/icons/favicon.ico">
    <!-- El manifest se carga desde partials/header.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital@1&family=Poppins:wght@300;700;900&display=swap" rel="stylesheet">
    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/accesibilidad.css" />
    <link rel="stylesheet" href="css/accessibility-buttons.css" />
    <link rel="stylesheet" href="css/translate.css" />
  </head>
  <body data-page-title="Directorio Institucional">

    <!-- Header incluido -->
    <div id="header-placeholder"></div>

    <!-- Contenedor para el breadcrumb -->
    <div id="breadcrumb-container" class="container mt-3">
      <!-- El breadcrumb se insertará aquí mediante JavaScript -->
    </div>

    <!-- Hero -->
    <section class="py-5 text-white" style="background: linear-gradient(135deg, #164443, #069681);">
      <div class="container text-center">
        <h1 class="fw-bold mb-3" data-page-title>Directorio Funcionarios </h1>
        <p class="lead mb-0">Directorio fotográfico de nuestros líderes y responsables de área..</p>
      </div>
    </section>

    <!-- Contenido principal -->
    <main class="container my-5">
      <!-- Barra de búsqueda -->
      <div class="row mb-5">
        <div class="col-md-8 mx-auto">
          <div class="input-group input-group-lg shadow-sm">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="directorio-search" class="form-control border-start-0" placeholder="Buscar por nombre o cargo...">
          </div>
        </div>
      </div>
    
      <!-- Estructura del Organigrama -->
      <div class="organigrama">
        <!-- Nivel 1: Gerente -->
        <div class="org-level org-level-1">
          <div class="row justify-content-center" id="directorio-gerente">
            <!-- Tarjeta del Gerente se inserta aquí -->
          </div>
        </div>

        <!-- Líneas de conexión -->
        <div class="org-connector-container">
          <div class="org-connector-down"></div>
        </div>

        <!-- Nivel 2: Asesores -->
        <div class="org-level org-level-asesores">
          <div class="row justify-content-center g-4" id="directorio-asesores">
            <!-- Tarjetas de Asesores se insertan aquí -->
          </div>
        </div>

        <!-- Líneas de conexión -->
        <div class="org-connector-container">
          <div class="org-connector-down"></div>
          <div class="org-connector-across"></div>
        </div>

        <!-- Nivel 3: Subgerencias -->
        <div class="org-level org-level-2">
          <div class="row">
            <div class="col-md-6 text-center org-branch">
              <div class="org-connector-up"></div>
              <div class="row justify-content-center" id="directorio-subgerencia-admin">
                <!-- Tarjeta Subgerencia Administrativa -->
              </div>
            </div>
            <div class="col-md-6 text-center org-branch">
              <div class="org-connector-up"></div>
              <div class="row justify-content-center" id="directorio-subgerencia-cientifica">
                <!-- Tarjeta Subgerencia Científica -->
              </div>
            </div>
          </div>
        </div>

        <!-- Líneas de conexión -->
        <div class="org-level org-level-3-connectors">
          <div class="row">
            <div class="col-md-6 text-center"><div class="org-connector-down-small"></div></div>
            <div class="col-md-6 text-center"><div class="org-connector-down-small"></div></div>
          </div>
        </div>

        <!-- Nivel 4: Departamentos -->
        <div class="org-level org-level-3">
          <div class="row g-5">
            <!-- Columna Administrativa -->
            <div class="col-lg-6">
              <h2 class="h4 fw-bold text-center text-brand mb-4">Área Administrativa</h2>
              <div class="row row-cols-1 g-4 justify-content-center" id="directorio-administrativos">
                <!-- Tarjetas del personal administrativo -->
              </div>
            </div>
            <!-- Columna Asistencial -->
            <div class="col-lg-6">
              <h2 class="h4 fw-bold text-center text-brand mb-4">Área Asistencial</h2>
              <div class="row row-cols-1 g-4 justify-content-center" id="directorio-asistenciales">
                <!-- Tarjetas del personal asistencial -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mensaje de no resultados -->
      <div id="no-results-message" class="text-center my-5 d-none">
        <i class="bi bi-search-heart display-4 text-muted"></i>
        <h3 class="mt-3">No se encontraron resultados</h3>
        <p class="text-muted">Intenta con otro nombre o cargo.</p>
      </div>
    </main>

<!-- Footer parcial -->
<div id="footer-placeholder"></div>

<!-- Scripts optimizados con defer -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/accesibilidad.js" defer></script>
<script src="js/accessibility-styles.js" defer></script>
<script src="js/busqueda.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/breadcrumb.js" defer></script>
<!-- Script específico para el directorio -->
<script src="js/directorio.js" defer></script>
</body>
</html>
