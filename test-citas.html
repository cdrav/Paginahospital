<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Citas Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/citas-online.css" />
</head>
<body>
    <div class="modern-container">
        <div class="form-card">
            <div class="step-wizard">
                <div class="step-progress">
                    <div class="step-progress-fill" id="progressBar" style="width: 0%;"></div>
                </div>
                <ol class="step-wizard-list">
                    <li class="step-item active" id="step1" role="listitem">
                        <div class="step-content-wrapper">
                            <div class="step-number">1</div>
                            <div class="step-label">Datos Personales</div>
                        </div>
                    </li>
                    <li class="step-item" id="step2" role="listitem">
                        <div class="step-content-wrapper">
                            <div class="step-number">2</div>
                            <div class="step-label">Especialidad</div>
                        </div>
                    </li>
                    <li class="step-item" id="step3" role="listitem">
                        <div class="step-content-wrapper">
                            <div class="step-number">3</div>
                            <div class="step-label">Fecha y Hora</div>
                        </div>
                    </li>
                    <li class="step-item" id="step4" role="listitem">
                        <div class="step-content-wrapper">
                            <div class="step-number">4</div>
                            <div class="step-label">Confirmación</div>
                        </div>
                    </li>
                </ol>
            </div>

            <div class="form-content">
                <form id="citaForm" class="cita-form">
                    <div class="form-slider">
                        <!-- Paso 1 -->
                        <div class="form-section active" id="paso1">
                            <h2 class="section-title">Paso 1: Datos Personales</h2>
                            <input type="text" class="form-control mb-3" placeholder="Nombre completo" id="nombres">
                            <input type="email" class="form-control mb-3" placeholder="Correo" id="correo">
                            <div class="form-actions">
                                <div></div>
                                <button type="button" class="btn-modern btn-primary-modern" data-action="next" data-step="1">
                                    Siguiente <i class="bi bi-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Paso 2 -->
                        <div class="form-section" id="paso2">
                            <h2 class="section-title">Paso 2: Especialidad</h2>
                            <p>Selecciona una especialidad</p>
                            <div class="form-actions">
                                <button type="button" class="btn-modern btn-secondary-modern" data-action="prev" data-step="2">
                                    <i class="bi bi-arrow-left"></i> Anterior
                                </button>
                                <button type="button" class="btn-modern btn-primary-modern" data-action="next" data-step="2" id="btnPaso2" disabled>
                                    Siguiente <i class="bi bi-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Paso 3 -->
                        <div class="form-section" id="paso3">
                            <h2 class="section-title">Paso 3: Fecha y Hora</h2>
                            <p>Selecciona fecha y hora</p>
                            <div class="form-actions">
                                <button type="button" class="btn-modern btn-secondary-modern" data-action="prev" data-step="3">
                                    <i class="bi bi-arrow-left"></i> Anterior
                                </button>
                                <button type="button" class="btn-modern btn-primary-modern" data-action="next" data-step="3" id="btnPaso3" disabled>
                                    Siguiente <i class="bi bi-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Paso 4 -->
                        <div class="form-section" id="paso4">
                            <h2 class="section-title">Paso 4: Confirmación</h2>
                            <p>Confirma tu cita</p>
                            <div class="form-actions">
                                <button type="button" class="btn-modern btn-secondary-modern" data-action="prev" data-step="4">
                                    <i class="bi bi-arrow-left"></i> Anterior
                                </button>
                                <button type="submit" class="btn-modern btn-success-modern">
                                    <i class="bi bi-check-circle"></i> Confirmar Cita
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/citas-medicas-online.js"></script>
</body>
</html>
