<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#164443">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Encuesta de Accesibilidad - Hospital Departamental San Antonio</title>
  <meta name="description" content="Encuesta de accesibilidad web del Hospital Departamental San Antonio. Ayúdanos a mejorar la accesibilidad de nuestro sitio web.">
  <link rel="icon" type="image/x-icon" href="/imagenes/icons/favicon.ico">
  <!-- El manifest se carga desde partials/header.html -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital@1&family=Poppins:wght@300;700;900&family=Work+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/accesibilidad.css" />
    <link rel="stylesheet" href="css/accessibility-buttons.css" />
    <link rel="stylesheet" href="css/encuesta.css" />
</head>
<body data-page-title="Encuesta de Accesibilidad">
<!-- Header incluido dinámicamente -->
<div id="header-placeholder"></div>

<!-- Contenedor para el breadcrumb -->
<div id="breadcrumb-container" class="container mt-3">
  <!-- El breadcrumb se insertará aquí mediante JavaScript -->
</div>

<main class="main-content p-0">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="encuesta-container bg-white p-4 rounded-3 shadow-sm">
                    <div class="text-center mb-5">
                        <h1 class="display-5 fw-bold text-primary mb-3">Encuesta de Accesibilidad Web</h1>
                        <p class="lead text-muted mb-0">Su opinión es muy valiosa para mejorar la experiencia de todos nuestros usuarios</p>
                        <div class="divider my-4">
                            <i class="bi bi-star-fill text-warning mx-2"></i>
                            <i class="bi bi-star-fill text-warning mx-2"></i>
                            <i class="bi bi-star-fill text-warning mx-2"></i>
                        </div>
                    </div>
                    
                    <!-- Contenedor del formulario con borde sutil -->
                    <div class="form-container border rounded-3 p-3 p-md-4 bg-light">
                        <div class="ratio ratio-16x9">
                            <iframe
                                src="https://docs.google.com/forms/d/e/1FAIpQLSfC7Ad6P6XHiIwrrD5B35kczxRyaNmqrwqoq80ZxhUQomSxPg/viewform?embedded=true"
                                style="border: 1px solid #dee2e6; border-radius: 0.375rem; background: white;"
                                title="Formulario de Encuesta de Accesibilidad"
                                allowfullscreen>
                                Cargando el formulario de encuesta...
                            </iframe>
                        </div>
                        
                        <!-- Mensaje alternativo mejorado -->
                        <div class="alert alert-light border mt-3 mb-0 d-flex align-items-center">
                            <i class="bi bi-info-circle text-primary fs-5 me-2"></i>
                            <div>
                                <small class="d-block">¿Tiene problemas para ver el formulario?</small>
                                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfC7Ad6P6XHiIwrrD5B35kczxRyaNmqrwqoq80ZxhUQomSxPg/viewform" 
                                   target="_blank" 
                                   rel="noopener" 
                                   class="btn btn-sm btn-outline-primary mt-2">
                                    <i class="bi bi-box-arrow-up-right me-1"></i> Abrir en nueva pestaña
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer incluido -->
<footer id="footer-placeholder" class="mt-5"></footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js" defer></script>
<script src="js/formulario-google.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/accessibility-styles.js" defer></script>
<script src="js/busqueda.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/breadcrumb.js" defer></script>
</body>
</html>
