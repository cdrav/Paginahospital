<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#164443">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Encuesta de Accesibilidad - Hospital Departamental San Antonio</title>
  <meta name="description" content="Encuesta de accesibilidad web del Hospital Departamental San Antonio. Ayúdanos a mejorar la accesibilidad de nuestro sitio web.">
  <!-- El manifest se carga desde partials/header.html -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital@1&family=Poppins:wght@300;700;900&family=Work+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="css/accesibilidad.css" />
    <link rel="stylesheet" href="css/accessibility-buttons.css" />
    <link rel="stylesheet" href="css/encuesta.css" />
</head>
<body data-page-title="Encuesta de Accesibilidad">
<!-- Header incluido dinámicamente -->
<div id="header-placeholder"></div>

<!-- Contenedor para el breadcrumb -->
<div id="breadcrumb-container" class="container mt-3">
  <!-- El breadcrumb se insertará aquí mediante JavaScript -->
</div>

<main class="main-content p-0">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="encuesta-container">
                    <h1 class="text-center mb-4">Encuesta de Accesibilidad Web</h1>
                    <p class="text-muted text-center mb-4">Su opinión nos ayuda a mejorar la experiencia de todos nuestros usuarios</p>
                    
                    <!-- Formulario de Google Forms -->
                    <div class="ratio ratio-16x9 mb-4">
                        <iframe src="https://docs.google.com/forms/d/e/[TU_ID_DEL_FORMULARIO]/viewform?embedded=true" 
                                frameborder="0" 
                                marginheight="0" 
                                marginwidth="0" 
                                style="border: none;"
                                title="Formulario de Encuesta de Accesibilidad">
                            Cargando el formulario de encuesta...
                        </iframe>
                    </div>
                    
                    <!-- Mensaje alternativo -->
                    <div class="alert alert-info mt-3">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        Si no puede ver el formulario, por favor 
                        <a href="https://docs.google.com/forms/d/e/[TU_ID_DEL_FORMULARIO]/viewform" target="_blank" rel="noopener" class="alert-link">
                            haga clic aquí para abrirlo en una nueva pestaña
                        </a>.
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer incluido -->
<footer id="footer-placeholder" class="mt-5"></footer>

<!-- Scripts -->
<script src="js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/accesibilidad.js"></script>
<script src="js/navbar-enhanced.js"></script>
<script src="js/accessibility-styles.js"></script>

<!-- Script para manejar el envío del formulario de Google -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Cargar header y footer (manejado por layout.js)
    
    // Manejar el evento de mensaje del iframe
    window.addEventListener('message', function(event) {
        // Verificar el origen del mensaje para seguridad
        if (event.origin === 'https://docs.google.com') {
            // Aquí puedes agregar lógica adicional si necesitas manejar respuestas del formulario
            console.log('Mensaje recibido del formulario:', event.data);
        }
    });
});
</script>

<!-- Scripts optimizados con defer -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/accesibilidad.js" defer></script>
<script src="js/accessibility-styles.js" defer></script>
<script src="js/busqueda.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/breadcrumb.js" defer></script>
</body>
</html>
